params:
  seed: ${...seed}
  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: True 

    space:
      continuous:
        mu_activation: tanh
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 512, 256] # Deeper and wider layers
      activation: elu
      d2rl: True # Deep Dense Residual Learning (D2RL) for better performance

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: ${if:${...checkpoint},True,False} # flag which sets whether to load the checkpoint
  load_path: ${...checkpoint} # path to the checkpoint to load

  config:
    name: ${resolve_default:More,${....experiment}}
    # full_experiment_name: ${.name}
    env_name: rlgpu
    multi_gpu: ${....multi_gpu}
    ppo: True
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    num_actors: ${....task.env.numEnvs}
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 2e-4 # slightly higher for faster convergence
    lr_schedule: adaptive
    kl_threshold: 0.008
    score_to_win: 150
    max_epochs: ${resolve_default:3000,${....max_iterations}}
    save_best_after: 25
    save_frequency: 25
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.01 # encourage exploration
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 256 # longer horizon length helps in complex reward shaping
    minibatch_size: 16384 # 128 for 8 objs, 16384
    mini_epochs: 10 # more mini-epochs for better convergence
    critic_coef: 4
    clip_value: False # Prevents critic over-clipping in early training. 
    seq_len: 32
    bounds_loss_coef: 0.0001
